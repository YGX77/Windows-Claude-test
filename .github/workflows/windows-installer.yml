name: Windows installer

# Takes the Ladybird-windows-x64.zip attached to a GitHub Release, adds the license files to it, builds a one-file
# Setup.exe installer from it, and attaches both to the same release along with its description. Run it by hand
# after the "Windows build" workflow has published a release.

on:
  # A push that changes this file also runs it, which is how GitHub first discovers a workflow on a non-default branch.
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/windows-installer.yml'
      - '.github/windows/ladybird-installer.nsi'
      - '.github/windows/NOTICE.txt'
      - '.github/windows/release-notes.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose zip to turn into an installer'
        required: true
        default: 'v0.1.2'
        type: string

permissions:
  contents: write

jobs:
  installer:
    name: Build Setup.exe
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis unzip

      - name: Download the release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag || 'v0.1.2' }}" --repo "${{ github.repository }}" --pattern Ladybird-windows-x64.zip
          mkdir stage
          unzip -q Ladybird-windows-x64.zip -d stage
          test -f stage/bin/Ladybird.exe
          test -f stage/bin/WebContent.exe
          test -d stage/share/Lagom

          # The BSD license requires the license text to come with the binaries.
          cp LICENSE stage/LICENSE
          cp .github/windows/NOTICE.txt stage/NOTICE.txt
          rm Ladybird-windows-x64.zip
          (cd stage && zip -q -r -9 ../Ladybird-windows-x64.zip .)
          unzip -l Ladybird-windows-x64.zip | grep -E ' (LICENSE|NOTICE.txt)$'

      - name: Build the installer
        run: |
          makensis -V2 \
            "-DSTAGE=${GITHUB_WORKSPACE}/stage" \
            "-DOUTFILE=${GITHUB_WORKSPACE}/Ladybird-Setup.exe" \
            "-DVERSION=${{ inputs.tag || 'v0.1.2' }}" \
            .github/windows/ladybird-installer.nsi
          ls -l Ladybird-Setup.exe

      - name: Attach the installer and zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || 'v0.1.2' }}" Ladybird-Setup.exe Ladybird-windows-x64.zip \
            --repo "${{ github.repository }}" --clobber
          gh release edit "${{ inputs.tag || 'v0.1.2' }}" --repo "${{ github.repository }}" \
            --notes-file .github/windows/release-notes.md
